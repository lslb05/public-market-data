services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dados
      POSTGRES_PASSWORD: dados
      POSTGRES_DB: dados_mercado_publico
    ports:
      # 5433 no host: 5432 já está ocupado por outro Postgres nesta máquina.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dados -d dados_mercado_publico"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
